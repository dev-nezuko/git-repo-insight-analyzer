# Render Blueprint: one web service built from the repository root.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: codebase-investigator
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && node scripts/productionBuild.mjs
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard; never commit the connection string.
      - key: MONGODB_URI
        sync: false
